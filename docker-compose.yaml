services:
  kafka:
    image: apache/kafka
    container_name: kafka-sun
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  mongo:
    image: mongo
    container_name: mongo-bright
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh","--eval", "show dbs"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
  raw-producer:
    build: ./services/raw_producer
    container_name: raw-producer
    depends_on:
      - kafka
  procesing-service:
    build: ./services/processing_service
    container_name: procesing-service
    depends_on:
      - kafka
      - raw-producer
  consume-to-mongo:
    build: ./services/ConsumeToMongo
    container_name: consume-to-mongo
    depends_on:
      mongo:
        condition: service_healthy
      procesing-service:
        condition: service_started
  api:
    build: ./services/API
    container_name: survy-api
    ports:
      - "8082:8080"
    depends_on:
      - consume-to-mongo
